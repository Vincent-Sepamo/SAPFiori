<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Select application — Replenishment App</title>
    <link rel="stylesheet" href="tiles.css" />
  </head>
  <body class="tiles-page">
    <header class="tiles-header" role="banner">
      <img
        class="tiles-header__logo"
        src="assets/sap-logo.png"
        alt="SAP"
        width="72"
        height="36"
      />
    </header>

    <main class="tiles-main">
      <div class="tiles-grid">
        <a class="app-tile" href="index.html">
          <span class="app-tile__icon-wrap" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="6" width="2.5" height="16" rx="0.5" fill="#0070f2" />
              <rect x="9" y="4" width="2.5" height="20" rx="0.5" fill="#0070f2" />
              <rect x="14" y="8" width="2.5" height="12" rx="0.5" fill="#0070f2" />
              <rect x="19" y="5" width="2.5" height="18" rx="0.5" fill="#0070f2" />
            </svg>
          </span>
          <p class="app-tile__label">Replenishment App</p>
        </a>

        <a
          class="app-tile"
          href="https://tempo-merry-33970129.figma.site/stock-locator"
          target="_blank"
          rel="noopener noreferrer"
        >
          <span class="app-tile__icon-wrap" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path
                d="M14 4.5c-3.6 0-6.5 2.9-6.5 6.5 0 4.9 6.5 12.5 6.5 12.5s6.5-7.6 6.5-12.5c0-3.6-2.9-6.5-6.5-6.5zm0 8.8a2.3 2.3 0 110-4.6 2.3 2.3 0 010 4.6z"
                fill="#0070f2"
              />
            </svg>
          </span>
          <p class="app-tile__label">Product locator</p>
        </a>

        <a
          class="app-tile app-tile--pending"
          href="#"
          id="tile-gap-scan"
          aria-label="Gap scan — workflow coming soon"
        >
          <span class="app-tile__icon-wrap" aria-hidden="true">
            <svg width="28" height="28" viewBox="0 0 28 28" fill="none" xmlns="http://www.w3.org/2000/svg">
              <rect x="4" y="6" width="2.5" height="16" rx="0.5" fill="#0070f2" />
              <rect x="9" y="4" width="2.5" height="20" rx="0.5" fill="#0070f2" />
              <rect x="14" y="8" width="2.5" height="12" rx="0.5" fill="#0070f2" />
              <rect x="19" y="5" width="2.5" height="18" rx="0.5" fill="#0070f2" />
            </svg>
          </span>
          <p class="app-tile__label">Gap scan</p>
        </a>
      </div>
      <p class="tiles-hint">Select an application to continue</p>
    </main>

    <script>
      (function () {
        var el = document.getElementById("tile-gap-scan");
        if (el) {
          el.addEventListener("click", function (e) {
            e.preventDefault();
          });
        }
      })();
    </script>
  </body>
</html>
